<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="100%" height="auto" style="max-width: 640px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; margin: 12px 0;">
